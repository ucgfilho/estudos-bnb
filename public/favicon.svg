<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo Vermelho Banco do Nordeste (Pantone 194 C / #A6193C) -->
  <rect width="64" height="64" rx="14" fill="#A6193C" />
  <!-- Moldura Laranja Banco do Nordeste (Pantone 151 C / #F68B1F) -->
  <rect x="6" y="6" width="52" height="52" rx="11" stroke="#F68B1F" stroke-width="4" />
  <!-- Coqueiro estilizado do Banco do Nordeste em Branco -->
  <g fill="#FFFFFF">
    <!-- Folha Superior Esquerda -->
    <path d="M30 27 C28 21 22 17 14 18 C 17 23 23 26 28 28 Z" />
    <!-- Folha Superior Direita -->
    <path d="M32 27 C34 21 40 17 48 18 C 45 23 39 26 34 28 Z" />
    <!-- Folha Inferior Direita -->
    <path d="M34 29 C40 31 45 36 47 42 C 41 41 36 36 32 31 Z" />
    <!-- Tronco curvado (da base esquerda até o centro da copa) -->
    <path d="M13 49 C14 43 18 36 28 29 C29 31 31 32 31 32 C26 37 21 43 19 49 Z" />
    <!-- Nó central que conecta as folhas -->
    <circle cx="31" cy="28.5" r="2.5" />
  </g>
</svg>
